name: terraform

on:
  pull_request:
    paths:
      - "modules/**"
      - "environments/**"
      - "bootstrap/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "modules/**"
      - "environments/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_VERSION: "1.9.8"
  TF_IN_AUTOMATION: "true"

jobs:
  # ---------------------------------------------------------------------------
  # Static checks: run on every PR, need no AWS credentials.
  # ---------------------------------------------------------------------------
  lint:
    name: fmt / validate / tflint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform init (no backend)
        working-directory: environments/${{ matrix.environment }}
        run: terraform init -backend=false -input=false

      - name: terraform validate
        working-directory: environments/${{ matrix.environment }}
        run: terraform validate -no-color

      - uses: terraform-linters/setup-tflint@v4

      - name: tflint
        run: |
          tflint --init
          tflint --recursive --format compact

  security:
    name: security scan (trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Trivy IaC misconfiguration scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          trivyignores: .trivyignore

  # ---------------------------------------------------------------------------
  # Plan on PRs and post it as a comment. Runs only once the repository
  # variable AWS_ROLE_ARN is set (GitHub -> Settings -> Variables).
  # ---------------------------------------------------------------------------
  plan:
    name: plan (${{ matrix.environment }})
    if: github.event_name == 'pull_request' && vars.AWS_ROLE_ARN != ''
    needs: [lint, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    defaults:
      run:
        working-directory: environments/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Keyless auth: GitHub OIDC -> IAM role. No AWS access keys stored anywhere.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - run: terraform init -input=false

      - name: terraform plan
        id: plan
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan | tee plan.txt

      - name: Comment plan on PR
        uses: actions/github-script@v7
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        with:
          script: |
            const fs = require('fs');
            const path = `environments/${process.env.ENVIRONMENT}/plan.txt`;
            let plan = fs.readFileSync(path, 'utf8');
            const max = 60000;
            if (plan.length > max) plan = plan.slice(-max) + '\n... (truncated, see workflow logs)';
            const marker = `<!-- tf-plan-${process.env.ENVIRONMENT} -->`;
            const body = `${marker}\n### Terraform plan: \`${process.env.ENVIRONMENT}\`\n<details><summary>Show plan</summary>\n\n\`\`\`hcl\n${plan}\n\`\`\`\n</details>`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body,
              });
            }

  # ---------------------------------------------------------------------------
  # Apply on merge to main. Dev applies first; prod waits for dev and for a
  # manual approval configured on the "prod" GitHub environment.
  # ---------------------------------------------------------------------------
  apply-dev:
    name: apply (dev)
    if: github.event_name == 'push' && vars.AWS_ROLE_ARN != ''
    needs: [lint, security]
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: environments/dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1
      - run: terraform init -input=false
      - run: terraform apply -input=false -auto-approve -lock-timeout=5m

  apply-prod:
    name: apply (prod)
    if: github.event_name == 'push' && vars.AWS_ROLE_ARN != ''
    needs: [apply-dev]
    runs-on: ubuntu-latest
    environment: prod # add "Required reviewers" to this environment in GitHub
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: environments/prod
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1
      - run: terraform init -input=false
      - run: terraform apply -input=false -auto-approve -lock-timeout=5m
